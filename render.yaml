# One web service. FastAPI serves frontend/dist and /api from the same origin.
# Name matches the existing service at https://fairlot.onrender.com.
services:
  - type: web
    name: fairlot
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: ANTHROPIC_INSPECTOR_MODEL
        sync: false
      - key: ANTHROPIC_MESSAGE_MODEL
        sync: false
      - key: ANTHROPIC_MESSAGE_EFFORT
        sync: false
      - key: SCOUT_LIVE
        value: "1"
      - key: SCOUT_INTERVAL_S
        value: "600"
      - key: BACKGROUND_INTERVAL_S
        value: "120"
